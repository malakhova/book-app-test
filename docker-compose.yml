version: '3.2'

services:
  nginx:
    build:
      context: environments/nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/app:cached
    links:
      - php

  php:
    restart: always
    build:
      context: environments/php
    ports:
      - "9098:9000"
    volumes:
      - ./:/var/www/app:cached

  mysql:
    image: mysql:8.0
    environment:
      # естественно для рабочих проектов через .env
      - MYSQL_ROOT_PASSWORD=verysecret
      - MYSQL_DATABASE=book_catalog
      - MYSQL_USER=book_admin
      - MYSQL_PASSWORD=secret
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./environments/mysql_data:/var/lib/mysql

